<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tu animal favorito</title>
    <style>
        body {
            font-family: Geneva, sans-serif;
            background-color: #121212;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .tarjeta {
            background-color: #f6f6ff;
            border-radius: 5px;
            padding: 50px 40px;
            text-align: center;
            width: 350px;
        }

        h1 {
            color: #28a745;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            color: #444;
            line-height: 1.5;
        }

        .resultado-animal {
            display: block;
            font-size: 28px;
            color: #007bff;
            font-weight: bold;
            margin: 20px 0;
            text-transform: capitalize; /* Para que la primera letra sea mayúscula */
        }

        a.boton-volver {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none; 
            background-color: #6c757d; 
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        a.boton-volver:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <div class="tarjeta">
        <h1>¡Excelente elección!</h1>
        
        <p>El animal que ingresaste como tu favorito es:</p>
        
        <!-- Variable con el animal ingresado por el usuario. -->
        <span class="resultado-animal">{{animalFavorito}}</span>
        
        <!-- Al hacer clic, el navegador hace un GET a la ruta '/' y devuelve al formulario -->
        <a href="/" class="boton-volver">Volver a intentar</a>
    </div>
</body>
</html>
